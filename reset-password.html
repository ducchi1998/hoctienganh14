<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đặt lại mật khẩu | Góc Học Tập</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#f3f2ff,#f2fbf8);font-family:Arial,sans-serif;color:#252544}.card{width:min(100%,440px);background:#fff;border-radius:22px;padding:30px;box-shadow:0 16px 50px #25254418}h1{margin:0 0 8px;font-size:26px}p{line-height:1.55;color:#62627a}label{display:block;margin:18px 0 6px;font-weight:600}input{width:100%;padding:13px;border:1px solid #dcdced;border-radius:10px;font:inherit}button{width:100%;margin-top:18px;padding:13px;border:0;border-radius:10px;background:#5b5ce2;color:#fff;font-weight:700;font-size:15px;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.message{min-height:24px;color:#5b5ce2}.back{display:block;margin-top:18px;text-align:center;color:#5b5ce2;text-decoration:none}
  </style>
</head>
<body>
  <main class="card">
    <h1>Đặt lại mật khẩu</h1>
    <p>Nhập mật khẩu mới cho tài khoản Góc Học Tập của bạn.</p>
    <form id="reset-form" hidden>
      <label for="new-password">Mật khẩu mới</label>
      <input id="new-password" type="password" minlength="6" autocomplete="new-password" required placeholder="Ít nhất 6 ký tự">
      <label for="confirm-password">Nhập lại mật khẩu mới</label>
      <input id="confirm-password" type="password" minlength="6" autocomplete="new-password" required placeholder="Nhập lại mật khẩu">
      <button id="save-button" type="submit">Lưu mật khẩu mới</button>
    </form>
    <p id="reset-message" class="message" role="status" aria-live="polite">Đang xác minh liên kết khôi phục...</p>
    <a class="back" href="/">Quay lại trang chủ</a>
  </main>
  <script>
    const SUPABASE_URL = "https://kduibehuxmfjmlvkkclh.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_3YKwb1l674WfoeWIzhjpVA_ZY5OZaq3";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const form = document.getElementById('reset-form');
    const message = document.getElementById('reset-message');
    let recoveryReady = false;
    let recoveryTimer;
    function showMessage(text, isError=false){message.textContent=text;message.style.color=isError?'#c54d4d':'#5b5ce2'}
    function enableRecovery(messageText='Liên kết hợp lệ. Hãy đặt mật khẩu mới.'){
      recoveryReady=true;
      clearTimeout(recoveryTimer);
      form.hidden=false;
      showMessage(messageText);
    }
    // Đọc lỗi từ cả hash và query string để hiển thị đúng lỗi Supabase.
    const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ''));
    const queryParams = new URLSearchParams(window.location.search);
    const recoveryError = hashParams.get('error_description') || hashParams.get('error_code')
      || queryParams.get('error_description') || queryParams.get('error_code');
    const isRecoveryUrl = hashParams.get('type') === 'recovery' || queryParams.get('type') === 'recovery';

    if (recoveryError) {
      showMessage('Liên kết khôi phục không hợp lệ hoặc đã hết hạn. Hãy quay lại trang đăng nhập và yêu cầu email mới.', true);
    } else {
      // Chỉ mở biểu mẫu khi Supabase xác nhận luồng khôi phục; không dựa riêng
      // vào một phiên đăng nhập cũ đang lưu trong trình duyệt.
      supabaseClient.auth.onAuthStateChange((event, session) => {
        if (session && (event === 'PASSWORD_RECOVERY' || (event === 'SIGNED_IN' && isRecoveryUrl))) {
          enableRecovery('Liên kết hợp lệ. Hãy đặt mật khẩu mới.');
        }
      });
      // Cho SDK thời gian xử lý token/code trước khi báo liên kết không hợp lệ.
      recoveryTimer = setTimeout(() => {
        if (!recoveryReady) showMessage('Liên kết không hợp lệ hoặc đã hết hạn. Hãy quay lại trang đăng nhập và yêu cầu email khôi phục mới.', true);
      }, 12000);
      (async()=>{
        const {data:{session},error}=await supabaseClient.auth.getSession();
        if(error){clearTimeout(recoveryTimer);showMessage('Không thể xác minh liên kết. Hãy yêu cầu email khôi phục mới.',true);return}
        if(isRecoveryUrl && session) enableRecovery('Hãy nhập mật khẩu mới của bạn.');
      })();
    }
    form.addEventListener('submit',async event=>{
      event.preventDefault();
      const password=document.getElementById('new-password').value;
      const confirm=document.getElementById('confirm-password').value;
      const button=document.getElementById('save-button');
      if(password.length<6){showMessage('Mật khẩu cần có ít nhất 6 ký tự.',true);return}
      if(password!==confirm){showMessage('Hai mật khẩu chưa trùng khớp.',true);return}
      if(!recoveryReady){showMessage('Liên kết khôi phục không hợp lệ hoặc đã hết hạn.',true);return}
      button.disabled=true;
      const {error}=await supabaseClient.auth.updateUser({password});
      button.disabled=false;
      if(error){showMessage('Không thể đổi mật khẩu: '+error.message,true);return}
      form.hidden=true;showMessage('Đổi mật khẩu thành công! Bạn có thể quay lại trang chủ và đăng nhập bằng mật khẩu mới.');
      await supabaseClient.auth.signOut();
    });
  </script>
</body>
</html>
